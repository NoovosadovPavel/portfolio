<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/portfolio/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #102c2f; --text: #eafcf8; --muted: #a9d5d0;
      --gradient: linear-gradient(120deg, #2dd4bf, #22d3ee, #99f6e4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      background: var(--bg); color: var(--text); text-align: center; padding: 24px;
      font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .code {
      font-size: clamp(6rem, 22vw, 13rem); font-weight: 800; line-height: 1;
      letter-spacing: -0.06em; background: var(--gradient);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { color: var(--muted); margin: 8px 0 32px; font-size: 1.05rem; }
    a {
      display: inline-block; padding: 13px 28px; border-radius: 999px;
      background: var(--text); color: var(--bg); font-weight: 700;
      text-decoration: none; transition: transform .2s, background .2s, color .2s;
    }
    a:hover { transform: translateY(-2px); background: #2dd4bf; color: #04211f; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <p>Такой страницы здесь нет. Возможно, она переехала.</p>
    <a href="/portfolio/">Вернуться на главную</a>
  </main>
</body>
</html>
