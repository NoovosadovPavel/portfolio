<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Компьютерный томограф">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12142a"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#43d9c4"/>
    </linearGradient>
    <radialGradient id="hole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b0d16"/>
      <stop offset="1" stop-color="#1a1e33"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500"/>
  </g>

  <!-- gantry -->
  <circle cx="330" cy="250" r="170" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.85"/>
  <circle cx="330" cy="250" r="140" fill="url(#hole)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="330" cy="250" r="118" fill="none" stroke="#43d9c4" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- patient table -->
  <rect x="150" y="300" width="470" height="16" rx="8" fill="#1e2338" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="480" y="268" width="150" height="34" rx="17" fill="#2a3050" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="250" y="242" width="330" height="22" rx="11" fill="#ffffff" opacity="0.16"/>

  <!-- base -->
  <rect x="286" y="408" width="88" height="42" rx="12" fill="#1b2033" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- indicators -->
  <g>
    <circle cx="620" cy="140" r="5" fill="#43d9c4"/>
    <circle cx="644" cy="140" r="5" fill="#ffd66b"/>
    <circle cx="668" cy="140" r="5" fill="#ff7a90" opacity="0.55"/>
  </g>

  <!-- side panel -->
  <rect x="560" y="170" width="190" height="150" rx="16" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="582" y="192" width="80" height="10" rx="5" fill="#7c6cff" opacity="0.9"/>
  <rect x="582" y="216" width="146" height="8" rx="4" fill="#ffffff" opacity="0.16"/>
  <rect x="582" y="236" width="120" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="582" y="256" width="134" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="582" y="284" width="64" height="20" rx="10" fill="#43d9c4" opacity="0.7"/>
</svg>
