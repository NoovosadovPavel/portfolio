<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Focus Timer — превью">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a1a"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43d9c4"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="22"/>
  <circle cx="400" cy="250" r="150" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="690 943" transform="rotate(-90 400 250)"/>
  <text x="400" y="238" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="64" font-weight="800" fill="#eef0f6">25:00</text>
  <text x="400" y="278" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="4" fill="#43d9c4">ФОКУС</text>
  <g>
    <rect x="300" y="400" width="90" height="40" rx="20" fill="#ffffff" opacity="0.1"/>
    <rect x="410" y="400" width="90" height="40" rx="20" fill="#43d9c4" opacity="0.8"/>
  </g>
  <g opacity="0.6">
    <circle cx="120" cy="120" r="4" fill="#7c6cff"/>
    <circle cx="680" cy="140" r="3" fill="#43d9c4"/>
    <circle cx="150" cy="390" r="3" fill="#ffd66b"/>
    <circle cx="660" cy="380" r="5" fill="#ff7a90"/>
  </g>
</svg>
