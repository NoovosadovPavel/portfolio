<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Лабораторное оборудование и поверка">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2a"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43d9c4"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- analyzer rack -->
  <rect x="60" y="90" width="380" height="320" rx="20" fill="#161b2c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <g>
    <rect x="88" y="118" width="324" height="78" rx="12" fill="#ffffff" opacity="0.05"/>
    <rect x="88" y="212" width="324" height="78" rx="12" fill="#ffffff" opacity="0.05"/>
    <rect x="88" y="306" width="324" height="78" rx="12" fill="#ffffff" opacity="0.05"/>

    <circle cx="116" cy="157" r="7" fill="#43d9c4"/>
    <circle cx="116" cy="251" r="7" fill="#43d9c4"/>
    <circle cx="116" cy="345" r="7" fill="#ffd66b"/>

    <rect x="142" y="146" width="130" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
    <rect x="142" y="168" width="86" height="8" rx="4" fill="#ffffff" opacity="0.1"/>
    <rect x="142" y="240" width="150" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
    <rect x="142" y="262" width="70" height="8" rx="4" fill="#ffffff" opacity="0.1"/>
    <rect x="142" y="334" width="118" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
    <rect x="142" y="356" width="96" height="8" rx="4" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- calibration card -->
  <rect x="470" y="110" width="270" height="280" rx="20" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <circle cx="605" cy="196" r="46" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <path d="M584 196 l14 15 l26 -30" fill="none" stroke="#43d9c4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="510" y="266" width="190" height="10" rx="5" fill="#ffffff" opacity="0.2"/>
  <rect x="510" y="288" width="140" height="8" rx="4" fill="#ffffff" opacity="0.12"/>

  <!-- graph of calibration points -->
  <g stroke="#7c6cff" stroke-width="3" fill="none">
    <path d="M510 352 L548 334 L586 340 L624 314 L662 320 L700 300"/>
  </g>
  <g fill="#43d9c4">
    <circle cx="510" cy="352" r="4"/>
    <circle cx="548" cy="334" r="4"/>
    <circle cx="586" cy="340" r="4"/>
    <circle cx="624" cy="314" r="4"/>
    <circle cx="662" cy="320" r="4"/>
    <circle cx="700" cy="300" r="4"/>
  </g>
</svg>
