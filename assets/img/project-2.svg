<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Аппарат искусственной вентиляции лёгких">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a20"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d9c4"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- device body -->
  <rect x="60" y="70" width="680" height="360" rx="26" fill="#151a2b" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="90" y="100" width="430" height="250" rx="16" fill="url(#screen)" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- waveform -->
  <path d="M110 300 C 150 210, 180 210, 200 300 C 215 360, 235 360, 250 300 C 270 200, 310 200, 330 300 C 350 390, 380 390, 400 300 C 418 220, 450 220, 470 300 L 500 300"
        fill="none" stroke="url(#wave)" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="300" x2="500" y2="300" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="4 6"/>

  <!-- values -->
  <g font-family="JetBrains Mono, monospace" fill="#eef0f6">
    <text x="110" y="140" font-size="13" fill="#43d9c4" letter-spacing="2">PEAK</text>
    <text x="110" y="178" font-size="34" font-weight="700">24</text>
    <text x="168" y="178" font-size="14" fill="#9aa1b4">cmH₂O</text>

    <text x="250" y="140" font-size="13" fill="#7c6cff" letter-spacing="2">VT</text>
    <text x="250" y="178" font-size="34" font-weight="700">450</text>
    <text x="316" y="178" font-size="14" fill="#9aa1b4">ml</text>

    <text x="390" y="140" font-size="13" fill="#ffd66b" letter-spacing="2">RATE</text>
    <text x="390" y="178" font-size="34" font-weight="700">14</text>
  </g>

  <!-- controls -->
  <g>
    <circle cx="600" cy="160" r="42" fill="#1b2136" stroke="#43d9c4" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="600" cy="160" r="14" fill="#43d9c4" opacity="0.85"/>
    <rect x="548" y="226" width="104" height="10" rx="5" fill="#ffffff" opacity="0.14"/>
    <rect x="548" y="250" width="72" height="10" rx="5" fill="#ffffff" opacity="0.1"/>
    <rect x="548" y="286" width="46" height="18" rx="9" fill="#7c6cff" opacity="0.8"/>
    <rect x="604" y="286" width="46" height="18" rx="9" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- bottom bar -->
  <rect x="90" y="372" width="620" height="34" rx="17" fill="#ffffff" opacity="0.05"/>
  <rect x="108" y="384" width="120" height="10" rx="5" fill="#43d9c4" opacity="0.5"/>
  <rect x="244" y="384" width="80" height="10" rx="5" fill="#ffffff" opacity="0.14"/>
  <rect x="340" y="384" width="96" height="10" rx="5" fill="#ffffff" opacity="0.1"/>
</svg>
